spring.application.name=diccionario-app-servidor

# --- Repositorio en BBDD ---
# En fichero y no en memoria: en memoria la BBDD se vacía en cada arranque y la huella de los
# ficheros no evitaría ninguna recarga.
spring.datasource.url=jdbc:h2:file:./datos/diccionarios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Unas 10000 palabras al cargar: en lotes, no una sentencia por fila.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
